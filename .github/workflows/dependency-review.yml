name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /tmp/sbom.json --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")
          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "::warning::Dependency Graph is not enabled. Enable it in Settings > Security analysis."
      - uses: actions/dependency-review-action@v4
        if: steps.dependency-graph.outputs.enabled == 'true'
